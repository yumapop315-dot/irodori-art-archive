<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="彩りアートアーカイブ">
  <title>彩りアートアーカイブ</title>
  <defs>
    <!-- サイトのボタン(.ba-btn)と同じ青のグラデーション -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22a6ff"/>
      <stop offset="0.55" stop-color="#0098ff"/>
      <stop offset="1" stop-color="#0075d8"/>
    </linearGradient>
    <!-- ヘッダーのヘイロー(.ba-halo)を、サイトの黄色トークン寄りの金色にしたもの -->
    <linearGradient id="halo" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#fff0b8"/>
      <stop offset="1" stop-color="#ffcf1f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#halo)" stroke-width="7"/>
</svg>
